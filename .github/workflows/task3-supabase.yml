name: Task 3 Supabase 검증

on:
  push:
    branches:
      - task/3-supabase-ci
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task3-supabase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_MIGRATION: "20260910003438"
  EXPECTED_PROJECT_NAME: kwater-prize-draw-dev

jobs:
  local-db-test:
    name: 임시 로컬 DB와 전체 검증
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 고정 의존성 설치
        run: npm ci

      - name: Docker 실행 상태 확인
        run: docker info --format '{{json .ServerVersion}}'

      - name: Supabase CLI 버전 확인
        run: npm exec supabase -- --version

      - name: Supabase 임시 DB 시작과 migration 적용
        run: npm exec supabase -- start

      - name: 로컬 pgTAP 실행
        run: npm exec supabase -- test db --local

      - name: 로컬 생성 타입 구문 확인
        shell: bash
        run: |
          set -euo pipefail
          npm exec supabase -- gen types --local --lang typescript > /tmp/generated-types.ts
          node -e 'new TextDecoder("utf-8", { fatal: true }).decode(require("node:fs").readFileSync("/tmp/generated-types.ts"))'
          npx tsc --noEmit --ignoreConfig --target ES2020 --module esnext --moduleResolution bundler --skipLibCheck /tmp/generated-types.ts

      - name: 전체 단위 테스트
        run: npm run test:run

      - name: TypeScript 검사
        run: npm run typecheck

      - name: ESLint 검사
        run: npm run lint

      - name: Prettier 검사
        run: npm run format:check

      - name: Production build
        run: npm run build

      - name: 실패 시 안전한 컨테이너 상태 출력
        if: failure()
        run: docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

      - name: Supabase 컨테이너 정리
        if: always()
        run: npm exec supabase -- stop --no-backup

  deploy-and-test-development:
    name: 전용 개발 DB 배포와 검증
    needs: local-db-test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/task/3-supabase-ci' &&
      github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 고정 의존성 설치
        run: npm ci

      - name: 필수 Repository secret 확인
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN이 없습니다.' >&2; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo 'SUPABASE_DB_PASSWORD가 없습니다.' >&2; exit 1; }
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo 'SUPABASE_PROJECT_ID가 없습니다.' >&2; exit 1; }
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]] || { echo 'SUPABASE_PROJECT_ID 형식이 올바르지 않습니다.' >&2; exit 1; }

      - name: 전용 개발 프로젝트 식별 검증
        shell: bash
        run: |
          set -euo pipefail
          actual_name="$(npm exec supabase -- projects list --output json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const projects = JSON.parse(input);
              const project = projects.find((item) => item.id === process.env.SUPABASE_PROJECT_ID);
              process.stdout.write(project?.name ?? "");
            });
          ')"
          test "$actual_name" = "$EXPECTED_PROJECT_NAME" || {
            echo '대상이 승인된 전용 개발 프로젝트가 아닙니다.' >&2
            exit 1
          }
          echo "전용 개발 프로젝트 이름 검증 완료: $EXPECTED_PROJECT_NAME"

      - name: 전용 개발 프로젝트 연결
        run: npm exec supabase -- link --project-ref "$SUPABASE_PROJECT_ID"

      - name: 적용 전 migration 상태 확인
        id: migration-state
        shell: bash
        run: |
          set -euo pipefail
          npm exec supabase -- migration list --linked > /tmp/migration-list-before.log
          if grep -Eq "${EXPECTED_MIGRATION}[[:space:]]*\|[[:space:]]*${EXPECTED_MIGRATION}" /tmp/migration-list-before.log; then
            echo 'already-applied=true' >> "$GITHUB_OUTPUT"
            echo "승인된 migration이 이미 적용되어 있습니다: $EXPECTED_MIGRATION"
          else
            echo 'already-applied=false' >> "$GITHUB_OUTPUT"
            echo "승인된 migration이 적용 대상입니다: $EXPECTED_MIGRATION"
          fi

      - name: 단일 초기 migration 확인과 dry-run
        if: steps.migration-state.outputs.already-applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 1 || { echo '적용 대상 migration이 한 개가 아닙니다.' >&2; exit 1; }
          test "${migrations[0]}" = "${EXPECTED_MIGRATION}_initial.sql" || { echo '승인되지 않은 migration입니다.' >&2; exit 1; }
          npm exec supabase -- db push --dry-run --linked > /tmp/db-push-dry-run.log 2>&1 || {
            sed -E 's/[a-z0-9]{20}/<project-ref-masked>/g; s#postgres(ql)?://[^ ]+#<database-url-masked>#g' /tmp/db-push-dry-run.log >&2
            exit 1
          }
          grep -q "$EXPECTED_MIGRATION" /tmp/db-push-dry-run.log || { echo 'dry-run에 승인된 migration이 없습니다.' >&2; exit 1; }
          echo "dry-run 적용 대상 확인 완료: $EXPECTED_MIGRATION"

      - name: 전용 개발 DB에 migration 적용
        if: steps.migration-state.outputs.already-applied != 'true'
        run: npm exec supabase -- db push --linked

      - name: migration 버전 일치 확인
        shell: bash
        run: |
          set -euo pipefail
          npm exec supabase -- migration list --linked > /tmp/migration-list.log
          grep -Eq "${EXPECTED_MIGRATION}[[:space:]]*\|[[:space:]]*${EXPECTED_MIGRATION}" /tmp/migration-list.log || {
            echo '로컬과 원격 migration 버전이 일치하지 않습니다.' >&2
            exit 1
          }
          echo "migration 버전 일치: $EXPECTED_MIGRATION"

      - name: 원격 pgTAP 실행
        run: npm exec supabase -- test db --linked

      - name: Database Advisors security
        run: npm exec supabase -- db advisors --linked --type security --level info --fail-on error

      - name: Database Advisors performance
        run: npm exec supabase -- db advisors --linked --type performance --level info --fail-on error

      - name: 원격 타입 생성과 UTF-8·구문 검증
        id: generated-types
        shell: bash
        run: |
          set -euo pipefail
          npm exec supabase -- gen types --linked --lang typescript > /tmp/generated-types.ts
          node -e 'new TextDecoder("utf-8", { fatal: true }).decode(require("node:fs").readFileSync("/tmp/generated-types.ts"))'
          npx tsc --noEmit --ignoreConfig --target ES2020 --module esnext --moduleResolution bundler --skipLibCheck /tmp/generated-types.ts
          if [[ -f src/lib/supabase/types.ts ]] && cmp -s /tmp/generated-types.ts src/lib/supabase/types.ts; then
            echo 'match=true' >> "$GITHUB_OUTPUT"
          else
            echo 'match=false' >> "$GITHUB_OUTPUT"
            echo '생성 타입이 저장소 파일과 다릅니다.' >&2
          fi

      - name: 생성 타입 보관
        if: steps.generated-types.outputs.match != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: task3-generated-types
          path: /tmp/generated-types.ts
          retention-days: 1

      - name: 생성 타입 일치 강제
        if: steps.generated-types.outputs.match != 'true'
        run: exit 1

      - name: 임시 연결 정보 정리
        if: always()
        shell: bash
        run: |
          rm -f supabase/.temp/project-ref
          rm -f /tmp/db-push-dry-run.log /tmp/migration-list-before.log /tmp/migration-list.log /tmp/generated-types.ts
