name: Preview Supabase Migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Preview Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: xmrezoudkgktbtfmzxhu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply and verify Preview migrations
        shell: bash
        run: |
          set -euo pipefail
          node tools/supabase-management-ci.mjs
