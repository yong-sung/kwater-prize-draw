name: Preview Supabase Migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Preview Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: xmrezoudkgktbtfmzxhu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 --version

      - name: Link Preview project
        shell: bash
        run: |
          set -euo pipefail
          set +x
          npx --yes supabase@2.117.0 link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: List remote migrations before push
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 migration list --linked

      - name: Push Preview migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 db push --linked

      - name: Verify remote migrations after push
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 migration list --linked
